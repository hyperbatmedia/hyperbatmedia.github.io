name: Derniers messages du forum

on:
  schedule:
    - cron: '17 * * * *'   # toutes les heures, à la minute 17
  workflow_dispatch:        # bouton « Run workflow » pour tester à la main

permissions:
  contents: write

concurrency:
  group: forum
  cancel-in-progress: true

jobs:
  forum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lire le flux du forum
        run: node scripts/fetch-forum.mjs
      - name: Enregistrer si ça a changé
        run: |
          git config user.name "forum-bot"
          git config user.email "forum-bot@users.noreply.github.com"
          git add data/forum.json
          if git diff --cached --quiet; then echo "Rien de nouveau"; else git commit -m "Derniers messages du forum" && git push; fi
